workflows:
  playport-source-check:
    name: Playport source checks
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      ubuntu: 24.04
    scripts:
      - name: Run diagnostics and upstream tests
        script: |
          set -euo pipefail
          python3 -m unittest discover -v -s tools/tests -p test_ktane_triage.py
          ./pp test --quick
